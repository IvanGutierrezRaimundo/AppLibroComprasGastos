<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Crear registro</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .crear-page{
      max-width: 860px;
      margin: 22px auto;
      padding: 0 14px;
    }
    .crear-head{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .crear-head h1{
      margin: 0;
      color: var(--color-brown);
    }
    .crear-head-actions{
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .registro-form{
      margin: 0;
      padding: 24px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: #FFF;
      box-shadow: var(--shadow-sm);
    }
    .registro-form-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .registro-form-grid .field-full{ grid-column: 1 / -1; }
    .registro-form .field label{
      display: block;
      margin-bottom: 6px;
      color: var(--color-brown);
      font-weight: 700;
    }
    .tipo-ayuda{
      display: none;
      margin-top: 8px;
      padding: 9px 11px;
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-primary);
      border-radius: 8px;
      background: #FFFDF0;
      color: var(--color-brown);
      font-size: 0.9rem;
      line-height: 1.3;
    }
    .tipo-ayuda.is-visible{ display: block; }
    .registro-form input,
    .registro-form select{
      width: 100%;
      box-sizing: border-box;
    }
    .resultado-fieldset{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 16px;
      margin: 22px 0 0;
      padding: 16px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      background: #FFFDF0;
    }
    .resultado-fieldset legend{
      padding: 0 8px;
      color: var(--color-brown);
      font-weight: 800;
    }
    .resultado-linea{
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .resultado-linea.total{
      grid-column: 1 / -1;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
      font-weight: 800;
    }
    .resultado-valor{
      color: var(--color-brown);
      font-weight: 800;
      white-space: nowrap;
    }
    .resultado-ayuda{
      grid-column: 1 / -1;
      margin: 0;
      color: var(--color-muted);
      font-size: 0.9rem;
      line-height: 1.3;
    }
    .registro-form-actions{
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }
    .registro-status{
      min-height: 1.4em;
      margin: 14px 0 0;
      color: #8A3D3D;
      font-weight: 600;
    }
    .proveedor-picker-modal{
      width: min(760px, 96vw);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .proveedor-picker-table-wrap{
      border: 1px solid #d8dfec;
      border-radius: 10px;
      overflow: auto;
      max-height: min(56vh, 420px);
      background: #fff;
    }
    .proveedor-picker-table{
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    .proveedor-picker-table th,
    .proveedor-picker-table td{
      padding: 9px 11px;
      border-bottom: 1px solid #edf1f7;
      text-align: left;
      white-space: nowrap;
    }
    .proveedor-picker-table th{
      position: sticky;
      top: 0;
      background: #f4f7fd;
      z-index: 1;
    }
    .proveedor-picker-row{ cursor: pointer; }
    .proveedor-picker-row:hover{ background: #f8fbff; }
    .proveedor-picker-row.is-selected{ background: #e6f0ff; }
    .proveedor-picker-status{ margin: 0; font-size: 0.92rem; color: #2f3e54; }
    .proveedor-picker-status.error{ color: #b42318; }
    .proveedor-picker-search{
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #c8d3e2;
      border-radius: 9px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }
    .proveedor-picker-search:focus{
      outline: 2px solid #9bc0ff;
      outline-offset: 1px;
      border-color: #89b1f7;
    }
    .proveedor-picker-empty{ margin: 0; padding: 14px; color: #5f6f87; }
    @media (max-width: 680px){
      .crear-page{
        margin-top: 14px;
        padding-left: 10px;
        padding-right: 10px;
      }
      .crear-head{
        align-items: flex-start;
        flex-direction: column;
      }
      .crear-head-actions{ width: 100%; }
      .crear-head-actions button{ flex: 1 1 auto; }
      .registro-form{ padding: 18px; }
      .registro-form-grid{ grid-template-columns: 1fr; gap: 14px; }
      .registro-form-grid .field-full{ grid-column: auto; }
      .registro-form-actions{ flex-direction: column-reverse; }
      .registro-form-actions button{ width: 100%; }
    }
  </style>
</head>
<body>
  <div id="react-create-registro-root"></div>
  <script src="/vendor/react/react.production.min.js"></script>
  <script src="/vendor/react-dom/react-dom.production.min.js"></script>
  <script src="/assets/react-create-registro.js"></script>
</body>
</html>
