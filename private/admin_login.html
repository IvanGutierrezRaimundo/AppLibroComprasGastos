<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Libro de gastos y compras</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background:
        radial-gradient(900px 480px at 82% -120px, rgba(236, 72, 153, .18), transparent 58%),
        radial-gradient(760px 420px at 10% -100px, rgba(6, 182, 212, .14), transparent 52%),
        linear-gradient(180deg, #f8f7ff 0%, #ffffff 100%);
      color: #172036;
    }
    .card {
      max-width: 360px;
      margin: 10vh auto;
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 18px 42px rgba(76, 29, 149, .14);
      border: 1px solid #ddd6fe;
    }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; color: #312e81; }
    label { display: block; font-size: .9rem; margin: .5rem 0 .25rem; color: #312e81; font-weight: 600; }
    input {
      width: 100%;
      padding: .6rem .7rem;
      border: 1px solid #ddd6fe;
      border-radius: 10px;
      color: #172036;
    }
    input:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, .18);
    }
    button {
      margin-top: 1rem;
      width: 100%;
      padding: .7rem;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(139, 92, 246, .28);
    }
    button:hover { filter: saturate(1.08); }
    .error { color: #b91c1c; margin-top: .5rem; min-height: 1.2rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Libro de gastos y compras</h1>
    <form id="loginForm">
      <label>Usuario</label>
      <input name="username" autocomplete="username" />
      <label>Contrasena</label>
      <input name="password" type="password" autocomplete="current-password" />
      <button type="submit">Entrar</button>
      <div id="error" class="error"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {
        username: fd.get('username'),
        password: fd.get('password'),
      };

      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (data.ok) {
        location.href = '/admin/libro-gastos-compras';
      } else {
        document.getElementById('error').textContent = data.error || 'Error';
      }
    });
  </script>
</body>
</html>
