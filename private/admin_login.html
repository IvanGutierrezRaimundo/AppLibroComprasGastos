<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Libro de gastos y compras</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-shell{
      min-height: calc(100vh - 4rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .react-login-card{
      width: min(100%, 420px);
      margin: 0 auto;
    }
    .react-login-header{
      margin-bottom: 1rem;
    }
    .react-login-title{
      margin: 0;
      color: var(--color-brown);
      font-size: 1.5rem;
      font-weight: 800;
    }
    .react-login-title::after{ display: none; }
    .react-login-form{
      display: grid;
      gap: .85rem;
    }
    .react-login-actions{
      display: grid;
      gap: .75rem;
      margin-top: .5rem;
    }
    .react-login-button{
      width: 100%;
      margin-top: 0;
    }
    .react-login-error{
      min-height: 1.2rem;
      color: #b91c1c;
      margin: 0;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div id="react-login-root"></div>
  </div>
  <script src="/vendor/react/react.production.min.js"></script>
  <script src="/vendor/react-dom/react-dom.production.min.js"></script>
  <script src="/assets/react-login.js"></script>
</body>
</html>
