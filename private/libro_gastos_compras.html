<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Libro de gastos y compras</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .admin-bar{ max-width: 1200px; margin: 0 auto var(--space-lg); display:flex; align-items:center; justify-content: space-between; }
    .menu-toggle-btn{
      display: none;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
    }
    @media (max-width: 680px){
      .admin-bar{ flex-wrap: wrap; position: relative; }
      .menu-toggle-btn{ display: inline-flex; }
      .admin-bar .actions{
        display: none;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        margin-top: 10px;
      }
      .admin-bar .actions.is-open{ display: flex; }
    }
    .admin-grid{ display:grid; grid-template-columns: 2.1fr 1fr 1fr 1fr 1fr 1fr 1fr auto; gap: 12px; align-items:end; }
    #filtrosToggleBtn{ display: none; }
    .filtros-panel-head{ display: none; }
    .filtros-close-btn{ display: none; }
    @media (max-width: 680px){
      #filtrosToggleBtn{ display: inline-flex; }
      .filtros-backdrop{
        position: fixed;
        inset: 0;
        background: rgba(43, 30, 24, 0.42);
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
        z-index: 1000;
      }
      .filtros-backdrop.is-open{ display: flex; }
      .filtros-panel{
        background: #FFF;
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 20px;
        width: 100%;
        max-width: 420px;
      }
      .filtros-panel-head{
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .filtros-panel-head h2{ margin: 0; color: var(--color-brown); font-size: 1.15rem; }
      .filtros-close-btn{
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: 1px solid var(--color-border);
        background: #FFF;
        color: var(--color-brown);
        font-size: 1.2rem;
        line-height: 1;
        cursor: pointer;
      }
      .filtros-backdrop .admin-grid{
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
    }
    .admin-table-wrap{ max-width: 100%; margin: 0 auto; overflow-x: auto; }
    .admin-doc{ max-width: 1200px; margin: 0 auto; }
    #registrosTable{ width: 100%; min-width: max-content; table-layout: auto; }
    #registrosTable th{
      font-size: 0.72rem;
      line-height: 1.15;
      padding: 8px 6px;
      white-space: nowrap;
    }
    #registrosTable .col-id{ display: none; }
    .btn-row{ display:inline-flex; align-items:center; gap:8px; white-space: nowrap; }
    .mod347-modal{ width: min(980px, 94vw); max-height: 90vh; overflow-y: auto; }
    .mod347-table-wrap{ overflow-x: auto; margin-top: 14px; }
    .mod347-table{ width: 100%; min-width: 680px; border-collapse: collapse; }
    .mod347-table th, .mod347-table td{ padding: 9px 10px; border-bottom: 1px solid var(--color-border); text-align: right; white-space: nowrap; }
    .mod347-table th:first-child, .mod347-table td:first-child,
    .mod347-table th:nth-child(2), .mod347-table td:nth-child(2){ text-align: left; }
    .mod347-empty{ margin: 16px 0 0; color: var(--color-muted); }
    button.proveedor-link{ padding: 0; border: 0; background: transparent; color: var(--color-brown); box-shadow: none; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; transform: none; }
    button.proveedor-link:hover{ background: transparent; color: var(--color-muted); box-shadow: none; transform: none; }
    #proveedorDetailModal{ background: rgba(255, 255, 255, 0.72); }
    .proveedor-detail-modal{ width: min(640px, 94vw); max-height: 90vh; overflow-y: auto; }
    .proveedor-detail-grid{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
    .proveedor-detail-item{ border: 1px solid var(--color-border); border-radius: 8px; padding: 8px; }
    .proveedor-detail-label{ margin: 0 0 3px; color: var(--color-muted); font-size: .78rem; }
    .proveedor-detail-value{ margin: 0; color: var(--color-brown); font-weight: 700; word-break: break-word; }
    .proveedor-edit-modal{ width: min(640px, 94vw); max-height: 90vh; overflow-y: auto; }
    .proveedor-edit-grid{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .proveedor-edit-grid .field-full{ grid-column: 1 / -1; }
    .proveedor-edit-grid label{ display: block; margin-bottom: 5px; color: var(--color-brown); font-weight: 700; }
    .proveedor-edit-grid input{ width: 100%; box-sizing: border-box; }
    .proveedor-edit-status{ min-height: 1.3em; margin: 10px 0 0; color: #8A3D3D; font-weight: 600; }
    @media (max-width: 560px){ .proveedor-detail-grid{ grid-template-columns: 1fr; } }
    @media (max-width: 560px){ .proveedor-edit-grid{ grid-template-columns: 1fr; } .proveedor-edit-grid .field-full{ grid-column: auto; } }
    .view-switch{ display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
    .view-switch-left, .view-switch-right{ display: flex; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 680px){
      .view-switch{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .view-switch-left{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
      .view-switch-left .view-toggle{ min-width: 0; padding: 8px 6px; font-size: 0.82rem; }
      #filtrosToggleBtn{ grid-column: 1 / -1; width: 100%; }
      .view-switch-right{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
      .view-switch-right .view-toggle{ min-width: 0; padding: 8px 6px; font-size: 0.82rem; }
    }
    .view-toggle{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }
    .view-toggle:hover{ border-color: var(--color-brown); }
    .view-toggle.is-active{
      background: #E5E7EB;
      border-color: #D1D5DB;
      color: #374151;
    }
    #gastosComunesBtn, #bienesInversionBtn{
      background: #E5E7EB;
      border-color: #D1D5DB;
      color: #374151;
    }
    #gastosComunesBtn.is-active, #bienesInversionBtn.is-active{
      background: var(--color-brown);
      border-color: var(--color-brown);
      color: #fff;
    }
    .load-more-btn{
      display: block;
      margin: 14px auto 0;
      min-width: 160px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-primary);
      color: var(--color-brown);
      font-weight: 800;
      cursor: pointer;
    }
    .load-more-btn:hover{ border-color: var(--color-brown); }
    .load-more-btn:disabled{ opacity: 0.6; cursor: default; }
    .cards-grid{
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .cards-grid.is-visible{ display: grid; }
    .registro-card{
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: #FFF;
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }
    .registro-card-head{
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .registro-card-id{
      color: var(--color-muted);
      font-size: 0.82rem;
      font-weight: 700;
    }
    .registro-card-tipo{
      background: #f4f4f5;
      color: var(--color-brown);
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
    }
    .registro-card-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
    }
    .registro-card-row{
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 8px;
      background: #FFF;
    }
    .registro-card-label{
      display: block;
      color: var(--color-muted);
      font-size: 0.76rem;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .registro-card-value{
      color: var(--color-brown);
      font-weight: 800;
      font-size: 0.92rem;
      word-break: break-word;
    }
    .empty-state{
      display: none;
      margin-top: 14px;
      padding: 14px;
      border: 1px dashed var(--color-border);
      border-radius: 10px;
      color: var(--color-muted);
      text-align: center;
    }
    .empty-state.is-visible{ display: block; }
    .resultado-fieldset{
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0 0;
      padding: 16px;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: #FFF;
    }
    .resultado-fieldset legend{
      padding: 0 8px;
      color: var(--color-brown);
      font-weight: 800;
    }
    .resultado-linea{
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: #FFF;
    }
    .resultado-linea > span:first-child{
      color: var(--color-muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .resultado-linea.full{ grid-column: 1 / -1; }
    .resultado-valor{
      color: var(--color-brown);
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .resultado-linea[title]{ cursor: help; }
    .tipos-fieldset{ margin-top: 16px; }
    .tipos-totales-list{
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tipo-linea{
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: #FFF;
    }
    .tipo-linea-nombre{ font-weight: 700; }
    .tipo-linea-valores{ color: var(--color-brown); font-weight: 700; white-space: nowrap; }
    .tipos-empty{ grid-column: 1 / -1; color: var(--color-muted); }
    @media (max-width: 900px){
      .resultado-fieldset{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 560px){
      .cards-grid{ grid-template-columns: 1fr; }
      .resultado-fieldset{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 680px){
      #registrosTable{ display: none !important; }
    }
  </style>
</head>
<body>
  <div id="react-libro-root"><span class="visually-hidden">Crear registro</span></div>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.3/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="/vendor/react/react.production.min.js"></script>
  <script src="/vendor/react-dom/react-dom.production.min.js"></script>
  <script src="/assets/react-libro-gastos-compras.js"></script>
</body>
</html>
